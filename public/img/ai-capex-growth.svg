<svg width="720" height="360" viewBox="0 0 720 360" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Combined Big Tech capital spending rising from about 410 billion dollars in 2025 to more than 700 billion in 2026 to a projected 1.1 trillion in 2027">
  <title>Big Tech&#39;s AI capital spending is exploding</title>
  <rect x="0" y="0" width="720" height="360" fill="#ffffff"/>
  <text x="36" y="44" font-family="'Inter','Helvetica Neue',Arial,sans-serif" font-size="26" font-weight="800" fill="#0E0E10">Big Tech&#39;s AI spending is exploding</text>
  <text x="36" y="70" font-family="'Inter','Helvetica Neue',Arial,sans-serif" font-size="15" fill="#6b7280">Combined capital spending — Amazon, Microsoft, Alphabet, Meta</text>

  <!-- baseline -->
  <line x1="60" y1="300" x2="690" y2="300" stroke="#e5e7eb" stroke-width="2"/>

  <!-- rising trend line -->
  <polyline points="160,237 360,186 560,130" fill="none" stroke="#19E3A6" stroke-width="3" stroke-dasharray="2 6" stroke-linecap="round" opacity="0.9"/>

  <!-- 2025 -->
  <rect x="110" y="237" width="100" height="63" rx="7" fill="#FFC400"/>
  <text x="160" y="228" text-anchor="middle" font-family="'Inter','Helvetica Neue',Arial,sans-serif" font-size="19" font-weight="800" fill="#0E0E10">$410B</text>
  <text x="160" y="326" text-anchor="middle" font-family="'Inter','Helvetica Neue',Arial,sans-serif" font-size="15" font-weight="700" fill="#0E0E10">2025</text>

  <!-- 2026 -->
  <rect x="310" y="186" width="100" height="114" rx="7" fill="#FFC400"/>
  <text x="360" y="177" text-anchor="middle" font-family="'Inter','Helvetica Neue',Arial,sans-serif" font-size="19" font-weight="800" fill="#0E0E10">$740B</text>
  <text x="360" y="326" text-anchor="middle" font-family="'Inter','Helvetica Neue',Arial,sans-serif" font-size="15" font-weight="700" fill="#0E0E10">2026</text>

  <!-- 2027 (projected, outline) -->
  <rect x="510" y="130" width="100" height="170" rx="7" fill="#FFF4CC" stroke="#FFC400" stroke-width="3" stroke-dasharray="7 5"/>
  <text x="560" y="121" text-anchor="middle" font-family="'Inter','Helvetica Neue',Arial,sans-serif" font-size="19" font-weight="800" fill="#0E0E10">~$1.1T</text>
  <text x="560" y="322" text-anchor="middle" font-family="'Inter','Helvetica Neue',Arial,sans-serif" font-size="13" font-weight="700" fill="#6b7280">2027 (projected)</text>

  <!-- +75% annotation -->
  <text x="260" y="162" text-anchor="middle" font-family="'Inter','Helvetica Neue',Arial,sans-serif" font-size="14" font-weight="800" fill="#12b886">+75% YoY</text>

  <text x="36" y="349" font-family="'Inter','Helvetica Neue',Arial,sans-serif" font-size="11" fill="#9ca3af">Total capital spending, not AI-only. 2027 is a projection. Sources: MLQ.ai, TechCrunch, Goldman Sachs.</text>
</svg>
