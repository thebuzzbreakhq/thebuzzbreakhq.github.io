<svg width="720" height="360" viewBox="0 0 720 360" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Apple gross margin stepping down from 50.1 percent in the June quarter to a reported 47.9 percent in the September quarter to a guided 45 to 46 percent for the December quarter.">
  <title>Apple's gross margin: the step down</title>
  <rect x="0" y="0" width="720" height="360" fill="#ffffff"/>
  <text x="36" y="44" font-family="'Inter','Helvetica Neue',Arial,sans-serif" font-size="26" font-weight="800" fill="#0E0E10">Apple&#39;s gross margin: the step down</text>
  <text x="36" y="70" font-family="'Inter','Helvetica Neue',Arial,sans-serif" font-size="15" fill="#6b7280">Reported quarters, then the December guide</text>

  <!-- baseline (axis starts at 40%) -->
  <line x1="70" y1="300" x2="680" y2="300" stroke="#cbd0d6" stroke-width="2"/>
  <text x="58" y="304" text-anchor="end" font-family="'Inter','Helvetica Neue',Arial,sans-serif" font-size="12" fill="#9ca3af">40%</text>

  <!-- Jun qtr 50.1% -->
  <rect x="110" y="132" width="110" height="168" rx="5" fill="#FFC400"/>
  <text x="165" y="120" text-anchor="middle" font-family="'Inter','Helvetica Neue',Arial,sans-serif" font-size="20" font-weight="800" fill="#0E0E10">50.1%</text>
  <text x="165" y="322" text-anchor="middle" font-family="'Inter','Helvetica Neue',Arial,sans-serif" font-size="14" font-weight="700" fill="#0E0E10">Jun &#39;26</text>

  <!-- Sep qtr (reported) 47.9% -->
  <rect x="320" y="168" width="110" height="132" rx="5" fill="#FFC400"/>
  <text x="375" y="156" text-anchor="middle" font-family="'Inter','Helvetica Neue',Arial,sans-serif" font-size="20" font-weight="800" fill="#0E0E10">47.9%</text>
  <text x="375" y="322" text-anchor="middle" font-family="'Inter','Helvetica Neue',Arial,sans-serif" font-size="13" fill="#0E0E10">Sep &#39;26 · reported</text>

  <!-- Dec qtr (guided) 45-46% -->
  <rect x="530" y="208" width="110" height="92" rx="5" fill="#FFF4CC" stroke="#FFC400" stroke-width="3" stroke-dasharray="7 5"/>
  <text x="585" y="196" text-anchor="middle" font-family="'Inter','Helvetica Neue',Arial,sans-serif" font-size="20" font-weight="800" fill="#0E0E10">45–46%</text>
  <text x="585" y="322" text-anchor="middle" font-family="'Inter','Helvetica Neue',Arial,sans-serif" font-size="13" fill="#6b7280">Dec &#39;26 · guided</text>

  <text x="36" y="350" font-family="'Inter','Helvetica Neue',Arial,sans-serif" font-size="11" fill="#9ca3af">Reported September-quarter margin vs Apple&#39;s December-quarter guidance. Axis starts at 40% to show the change. Source: Apple earnings call, CNBC.</text>
</svg>
