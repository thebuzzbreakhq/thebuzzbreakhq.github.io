<svg width="720" height="360" viewBox="0 0 720 360" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="October's AI sell-off drawn as a line that drops and then forks into two possible futures: one rising, labelled opportunity, a sale on the future; one falling further, labelled warning, a bubble starting to crack.">
  <title>The same drop, two different stories</title>
  <rect x="0" y="0" width="720" height="360" fill="#ffffff"/>
  <text x="36" y="44" font-family="'Inter','Helvetica Neue',Arial,sans-serif" font-size="26" font-weight="800" fill="#0E0E10">The same drop, two different stories</text>
  <text x="36" y="70" font-family="'Inter','Helvetica Neue',Arial,sans-serif" font-size="15" fill="#6b7280">October&#39;s AI sell-off — a warning, or a sale?</text>

  <!-- solid drop line -->
  <polyline points="70,150 210,150 295,245" fill="none" stroke="#0E0E10" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/>

  <!-- opportunity branch (green, up) -->
  <polyline points="315,236 640,110" fill="none" stroke="#12b886" stroke-width="4" stroke-dasharray="2 8" stroke-linecap="round"/>
  <polygon points="640,110 624,108 630,123" fill="#12b886"/>

  <!-- warning branch (red, down) -->
  <polyline points="315,254 640,300" fill="none" stroke="#e5484d" stroke-width="4" stroke-dasharray="2 8" stroke-linecap="round"/>
  <polygon points="640,300 625,293 627,306" fill="#e5484d"/>

  <!-- fork marker -->
  <circle cx="300" cy="245" r="21" fill="#FFC400"/>
  <text x="300" y="254" text-anchor="middle" font-family="'Inter','Helvetica Neue',Arial,sans-serif" font-size="25" font-weight="800" fill="#0E0E10">?</text>
  <text x="300" y="286" text-anchor="middle" font-family="'Inter','Helvetica Neue',Arial,sans-serif" font-size="11" fill="#9ca3af">the drop</text>

  <!-- opportunity labels -->
  <text x="498" y="131" font-family="'Inter','Helvetica Neue',Arial,sans-serif" font-size="16" font-weight="800" fill="#12b886">Opportunity</text>
  <text x="498" y="150" font-family="'Inter','Helvetica Neue',Arial,sans-serif" font-size="13" fill="#6b7280">a sale on the future</text>

  <!-- warning labels -->
  <text x="478" y="306" font-family="'Inter','Helvetica Neue',Arial,sans-serif" font-size="16" font-weight="800" fill="#e5484d">Warning</text>
  <text x="478" y="325" font-family="'Inter','Helvetica Neue',Arial,sans-serif" font-size="13" fill="#6b7280">a bubble starting to crack</text>

  <text x="36" y="349" font-family="'Inter','Helvetica Neue',Arial,sans-serif" font-size="11" fill="#9ca3af">Nobody knows which yet — that&#39;s the point. This is the question, not a prediction.</text>
</svg>
