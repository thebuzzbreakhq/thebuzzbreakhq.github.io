<svg width="720" height="360" viewBox="0 0 720 360" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="October 2026 monthly moves for three U.S. indexes: the AI-heavy Nasdaq fell about 5 percent, the S&amp;P 500 fell about 1.2 percent, and the Dow actually rose about 1.5 percent.">
  <title>A sell-off aimed at AI, not the whole market</title>
  <rect x="0" y="0" width="720" height="360" fill="#ffffff"/>
  <text x="36" y="44" font-family="'Inter','Helvetica Neue',Arial,sans-serif" font-size="26" font-weight="800" fill="#0E0E10">A sell-off aimed at AI — not everything</text>
  <text x="36" y="70" font-family="'Inter','Helvetica Neue',Arial,sans-serif" font-size="15" fill="#6b7280">October 2026 — how the three big U.S. indexes moved</text>

  <!-- zero line -->
  <line x1="60" y1="200" x2="690" y2="200" stroke="#cbd0d6" stroke-width="2"/>
  <text x="52" y="204" text-anchor="end" font-family="'Inter','Helvetica Neue',Arial,sans-serif" font-size="12" fill="#9ca3af">0%</text>

  <!-- Nasdaq -5% (down, red) -->
  <rect x="159" y="200" width="92" height="80" rx="6" fill="#e5484d"/>
  <text x="205" y="302" text-anchor="middle" font-family="'Inter','Helvetica Neue',Arial,sans-serif" font-size="17" font-weight="800" fill="#e5484d">−5%</text>
  <text x="205" y="332" text-anchor="middle" font-family="'Inter','Helvetica Neue',Arial,sans-serif" font-size="14" font-weight="700" fill="#0E0E10">Nasdaq</text>

  <!-- S&P 500 -1.2% (slightly down) -->
  <rect x="319" y="200" width="92" height="19" rx="5" fill="#f3b4b4"/>
  <text x="365" y="241" text-anchor="middle" font-family="'Inter','Helvetica Neue',Arial,sans-serif" font-size="15" font-weight="800" fill="#c0504d">−1.2%</text>
  <text x="365" y="332" text-anchor="middle" font-family="'Inter','Helvetica Neue',Arial,sans-serif" font-size="14" font-weight="700" fill="#0E0E10">S&amp;P 500</text>

  <!-- Dow +1.5% (up, green) -->
  <rect x="479" y="176" width="92" height="24" rx="6" fill="#12b886"/>
  <text x="525" y="166" text-anchor="middle" font-family="'Inter','Helvetica Neue',Arial,sans-serif" font-size="17" font-weight="800" fill="#12b886">+1.5%</text>
  <text x="525" y="332" text-anchor="middle" font-family="'Inter','Helvetica Neue',Arial,sans-serif" font-size="14" font-weight="700" fill="#0E0E10">Dow</text>

  <text x="36" y="349" font-family="'Inter','Helvetica Neue',Arial,sans-serif" font-size="11" fill="#9ca3af">At ~these levels, Oct 2026. The Dow rose while the AI-heavy Nasdaq fell. Sources: Yahoo Finance, CNN.</text>
</svg>
